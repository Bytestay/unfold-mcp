name: Release

# release-please opens a release PR from Conventional Commits; merging it creates the GitHub release,
# then publish.yml runs on the new tag: PyPI with Trusted Publishing, then the MCP registry.
# PyPI's trusted publisher is publish.yml, so this workflow only dispatches it (a GITHUB_TOKEN
# tag push would not start it, but a workflow_dispatch does).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # Falls back to GITHUB_TOKEN; needs "Allow GitHub Actions to create and approve pull requests".
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run publish.yml on the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
