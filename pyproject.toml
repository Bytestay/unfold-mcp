[project]
name = "bytestay-unfold-mcp"
version = "0.2.8"
description = "PDF, DOCX, PPTX and XLSX documents to Markdown for LLM agents, from a URL or a local file. Bring your own RapidAPI or api.market key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ByteStay", email = "hello@bytestay.pt" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.urls]
Homepage = "https://unfold.bytestay.pt"
Repository = "https://github.com/bytestay/unfold-mcp"
Issues = "https://github.com/bytestay/unfold-mcp/issues"
Changelog = "https://github.com/bytestay/unfold-mcp/blob/main/CHANGELOG.md"

[project.scripts]
unfold-mcp = "unfold_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unfold_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=unfold_mcp --cov-report=term-missing:skip-covered --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
